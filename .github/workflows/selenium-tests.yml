name: Selenium E2E Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Run 16 Actor Use-Case Selenium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build and Start Application Server
        run: |
          npm run build
          npm run preview -- --port 3000 &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Selenium & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Selenium E2E Tests
        env:
          APP_URL: http://localhost:3000
          HEADLESS: "true"
        run: |
          pytest tests/test_creator_crew_selenium.py -v --headless --html=report.html --self-contained-html


      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: report.html
          retention-days: 14
